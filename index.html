<style>
:root{
  --coffee:#291C0E;--cocoa:#6E473B;--taupe:#A78D78;--stone:#BEB5A9;--sand:#E1D4C2;--cream:#F4E6D2;
  --bg:#FAF3E9;--bg-alt:#F4E6D2;--surface:#FFFBF5;--line:#E1D4C2;--ink:#291C0E;--ink-2:#54402F;--muted:#76604F;
  --accent:#6E473B;--accent-ink:#FAF3E9;--chip:#EFE3D1;--ok:#4F6B45;--warn:#9A4B2F;
  --display:"Tenor Sans","Optima","Candara","Segoe UI",sans-serif;
  --body:"Manrope","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--taupe);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 24px;font-weight:600;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);transition:background .15s,transform .15s}
.btn:hover{background:var(--coffee);color:var(--cream)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--stone)}
.btn.ghost:hover{background:var(--chip)}
.btn.small{padding:7px 14px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--warn);border-color:transparent}
.btn.danger:hover{background:var(--chip)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{font-family:var(--display);font-size:1.2rem;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:.93rem;white-space:nowrap}
.nav a:hover{background:var(--chip);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--chip);color:var(--ink);font-weight:600}
.menu-btn{display:none;border:1px solid var(--stone);background:transparent;border-radius:999px;width:42px;height:38px;cursor:pointer;font-size:1.1rem;line-height:1}
@media (max-width:900px){
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:2px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 16px;margin:0}
  .nav.open{display:flex}
  .nav a{padding:12px 14px}
}

/* hero */
.hero{padding:clamp(40px,7vw,88px) 0 clamp(56px,8vw,104px)}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(32px,6vw,72px);align-items:center}
.hero h1{font-size:clamp(2.1rem,4.3vw,3.2rem);letter-spacing:-.01em}
.hero .lead{font-size:1.15rem;color:var(--ink-2);max-width:40ch;margin:22px 0 20px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px}
.hero .actions .btn{padding:12px 20px}
.portrait{position:relative;justify-self:end;width:min(100%,380px);margin:0}
.portrait img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:40% 30%;border-radius:28px;background:var(--sand)}
.portrait .tagcard{position:absolute;left:-32px;bottom:36px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 20px 15px;box-shadow:0 14px 34px rgba(41,28,14,.16);max-width:calc(100% - 24px)}
.tagcard strong{display:block;font-family:var(--display);font-weight:400;font-size:1.12rem;line-height:1.25}
.tagcard span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.about-photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:40% 30%;border-radius:28px;margin-bottom:18px}
.hero-info{margin:0 0 30px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);max-width:46ch}
.hero-info li{padding-left:20px;position:relative}
.hero-info li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--taupe)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.portrait{justify-self:center;width:min(100%,380px)}.portrait .tagcard{left:14px;bottom:14px}}

/* sections */
.section{padding:clamp(56px,8vw,96px) 0;scroll-margin-top:70px}
.section.alt{background:var(--bg-alt)}
.section h2{font-size:clamp(1.8rem,3.6vw,2.5rem);margin-bottom:12px}
.section .sub{color:var(--muted);max-width:60ch;margin-bottom:36px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px 36px;counter-reset:s}
.steps li{counter-increment:s;padding-top:18px;border-top:1px solid var(--stone)}
.steps li::before{content:counter(s);font-family:var(--display);font-size:1.9rem;color:var(--taupe);display:block;margin-bottom:8px}
.steps h3{font-size:1.2rem;margin-bottom:6px}
.steps p{color:var(--ink-2);margin:0}
.price-list{border-top:1px solid var(--stone)}
.price-row{display:grid;grid-template-columns:1fr auto;gap:6px 24px;padding:22px 0;border-bottom:1px solid var(--stone);align-items:baseline}
.price-row h3{font-size:1.3rem}
.price-row .p{font-family:var(--display);font-size:1.5rem;white-space:nowrap}
.price-row p{grid-column:1/-1;color:var(--ink-2);margin:0;max-width:62ch}
.promos{display:flex;flex-direction:column;gap:14px}
.promo{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:20px 32px;display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline}
.promo strong{font-family:var(--display);font-weight:400;font-size:1.25rem}
.promo span{color:var(--ink-2)}
@media (max-width:600px){.promo{border-radius:28px;padding:18px 22px}}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.task .tag{display:inline-block;font-size:.8rem;background:var(--chip);color:var(--ink-2);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.task h3{font-family:var(--body);font-weight:600;font-size:1.02rem;margin-bottom:6px}
.task p{white-space:pre-line;color:var(--ink-2);font-size:.96rem}
.task details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
.task details div{margin-top:8px;padding:10px 14px;background:var(--chip);border-radius:12px;white-space:pre-line}
.bank-secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.bank-sec{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 24px}
.bank-sec h3{font-size:1.25rem;margin-bottom:6px}
.bank-sec p{margin:0;color:var(--muted);font-size:.93rem}
.page-head{padding:clamp(44px,7vw,80px) 0 0}
.page-head h1{font-size:clamp(2.2rem,4.6vw,3.3rem);margin-bottom:12px}
.page-head p{color:var(--muted);max-width:60ch;margin:0}
.page-body{padding:clamp(32px,5vw,52px) 0 clamp(56px,8vw,88px)}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hub a{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:170px;padding:24px 26px;border-radius:28px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:background .15s,border-color .15s}
.hub a:hover{border-color:var(--taupe);background:var(--bg)}
.hub a:first-child{background:var(--cocoa);border-color:var(--cocoa);color:#FAF3E9}
.hub a:first-child .hub-note{color:#E1D4C2}
.hub a:first-child:hover{background:var(--coffee)}
.hub h3{font-size:1.55rem}
.hub-note{color:var(--muted);font-size:.95rem}
.hub-big{font-family:var(--display);font-size:1.3rem;display:block;margin-bottom:2px}
@media (max-width:900px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.hub{grid-template-columns:1fr}.hub a{min-height:0}}
.faq{max-width:760px;border-top:1px solid var(--stone)}
.faq details{border-bottom:1px solid var(--stone)}
.faq summary{list-style:none;cursor:pointer;padding:20px 44px 20px 0;position:relative;font-family:var(--display);font-size:1.25rem;line-height:1.3}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:var(--body);font-size:1.5rem;color:var(--taupe);transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0 0 22px;color:var(--ink-2);max-width:64ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px 44px}
.rules section{border-top:1px solid var(--stone);padding-top:18px}
.rules h3{font-size:1.3rem;margin-bottom:8px}
.rules p{color:var(--ink-2);margin:0}
.reviews{columns:3 260px;column-gap:16px}
.review{break-inside:avoid;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.review button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.review img{display:block;width:100%;height:auto}
.review.txt{padding:22px 24px 20px}
.review .stars{color:var(--taupe);letter-spacing:2px;font-size:.95rem}
.review blockquote{margin:10px 0 16px;color:var(--ink);line-height:1.6}
.review .who{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.review .who strong{font-family:var(--display);font-weight:400;font-size:1.15rem}
.review .who span{color:var(--muted);font-size:.87rem}
.review .orig{background:none;border:0;padding:0;margin-top:10px;color:var(--accent);font-weight:600;font-size:.87rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;width:auto;display:inline}
.home-reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.home-reviews .review{margin:0}
.review figcaption{padding:10px 16px 12px;font-size:.9rem;color:var(--ink-2)}
.promos-block{margin-top:56px}
.promos-block h2{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:18px}
.pay-big{font-family:var(--display);font-size:clamp(2.4rem,6vw,3.4rem);line-height:1}
.pay-big.debt{color:var(--warn)}
.pay-sum{display:flex;flex-wrap:wrap;gap:12px 36px;margin:18px 0 8px;color:var(--ink-2)}
.pay-sum strong{color:var(--ink)}
.pk-dots{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.pk-dot{width:28px;height:28px;border-radius:50%;background:var(--cocoa)}
.pk-dot.used{background:transparent;border:1.5px dashed var(--stone)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.stat .v{font-family:var(--display);font-size:1.8rem;line-height:1.15;margin-top:4px}
.stat .l{color:var(--muted);font-size:.9rem}
.stat.main{background:var(--cocoa);border-color:var(--cocoa);color:#FAF3E9}
.stat.main .l{color:#E1D4C2}
.chart .bar{fill:var(--taupe)}
.chart .bar.cur{fill:var(--cocoa)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.item.sel{border-color:var(--cocoa);box-shadow:0 0 0 1px var(--cocoa)}
button.item{text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
button.item:hover{border-color:var(--taupe)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.results + .reviews-title{margin-top:56px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.result{border-left:2px solid var(--taupe);padding-left:18px}
.result .r{font-family:var(--display);font-size:1.7rem;line-height:1.2}
.result .n{font-weight:600;margin:6px 0 4px}
.result p{color:var(--ink-2);margin:0;font-size:.95rem}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,5vw,64px)}
.about .text p{font-size:1.06rem;max-width:62ch}
.contact-box{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 28px;align-self:start}
.contact-box h3{font-size:1.25rem;margin-bottom:10px}
.contact-box p{white-space:pre-line;color:var(--ink-2)}
@media (max-width:760px){.about{grid-template-columns:1fr}}
.cta-band{background:var(--cocoa);color:#F7E9DA;border-radius:999px;padding:34px 44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.cta-band h2{font-size:clamp(1.4rem,3vw,2rem);margin:0;color:#FAF3E9}
.cta-band .btn{background:var(--cream);color:var(--coffee)}
.cta-band .btn:hover{background:#fff}
@media (max-width:600px){.cta-band{border-radius:32px;padding:28px}}
footer{padding:36px 0 44px;color:var(--muted);font-size:.9rem}
footer .legal{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.84rem}
footer .legal a{color:var(--ink-2)}
.doc{max-width:780px}
.doc h2{font-size:1.35rem;margin:34px 0 10px}
.doc p,.doc li{color:var(--ink-2)}
.doc ul{padding-left:22px;margin:0 0 .8em}
.doc li{margin-bottom:4px}
.doc .ed{color:var(--muted);font-size:.9rem}
.consent-check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;line-height:1.45;color:var(--ink-2);margin:4px 0 16px}
.consent-check input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--cocoa)}
.warn-box{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:16px;padding:12px 16px;color:var(--warn);font-size:.92rem;margin-bottom:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink-2)}
.empty{color:var(--muted);padding:18px 0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(41,28,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border-radius:28px;width:min(560px,100%);max-height:100%;overflow:auto;padding:30px 28px;position:relative;box-shadow:0 20px 60px rgba(41,28,14,.3)}
.modal-card h3{font-size:1.6rem;margin-bottom:8px;padding-right:36px}
.modal-card .x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:1.3rem;line-height:1}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--taupe)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.label-s{font-weight:600;font-size:.92rem;margin:18px 0 8px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.88rem;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--taupe);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--taupe) 30%,transparent)}
.field .hint{font-size:.82rem;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px}
.err{color:var(--warn);font-size:.92rem;margin:4px 0 12px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:.95rem}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1}

/* app */
.app-head{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.app-head .wrap{display:flex;align-items:center;gap:14px;min-height:68px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.app-head .who{margin-right:auto}
.app-head .who small{display:block;color:var(--muted);font-size:.82rem}
.app-head .who strong{font-family:var(--display);font-weight:400;font-size:1.2rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:24px;padding:5px;margin:28px 0 30px;max-width:100%;width:max-content}
.tab{border:0;background:transparent;border-radius:999px;padding:9px 18px;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:500}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(41,28,14,.12)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;line-height:20px}
.panel{padding-bottom:64px}
.panel h2{font-size:1.7rem;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px}
.box h3{font-size:1.2rem;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.item-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.item h4{margin:0;font-size:1.05rem;font-weight:600}
.item .meta{color:var(--muted);font-size:.9rem}
.item .desc{white-space:pre-line;color:var(--ink-2);margin:10px 0 0}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 11px;background:var(--chip);color:var(--ink-2)}
.badge.sub{background:var(--taupe);color:#FFF8EE}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.badge.late{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.87rem;cursor:pointer;max-width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.lesson{display:grid;grid-template-columns:110px 1fr auto;gap:4px 18px;align-items:center}
.lesson .when{font-family:var(--display);font-size:1.15rem;line-height:1.25}
.lesson .when small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.lesson{grid-template-columns:1fr}}
.prog-head{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;margin-bottom:14px}
.prog-head .big{font-family:var(--display);font-size:2.4rem;line-height:1}
.prog-head .big small{font-family:var(--body);font-size:1rem;color:var(--muted)}
.prog-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--chip);margin-bottom:22px;max-width:680px}
.prog-bar i{display:block;height:100%}
.prog-bar .b2{background:var(--cocoa)}.prog-bar .b1{background:var(--taupe)}
.ege-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px;max-width:680px}
@media (max-width:700px){.ege-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ege{aspect-ratio:1;border-radius:18px;border:1.5px solid var(--stone);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.35rem;color:var(--ink);padding:0}
button.ege{cursor:pointer;transition:transform .12s}
button.ege:hover{transform:translateY(-2px)}
.ege.s1{background:linear-gradient(to top,var(--taupe) 50%,var(--surface) 50%);border-color:var(--taupe)}
.ege.s2{background:var(--cocoa);border-color:var(--cocoa);color:#FAF3E9}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;color:var(--ink-2);font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ege{width:20px;height:20px;border-radius:6px;aspect-ratio:auto}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--taupe);opacity:.18}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .val{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body)}
.mock-row{display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;align-items:baseline}
.mock-row .sc{font-family:var(--display);font-size:1.5rem}
.delta{font-size:.85rem;font-weight:600}
.delta.up{color:var(--ok)}.delta.down{color:var(--warn)}
.creds{background:var(--chip);border-radius:18px;padding:16px 18px;margin-top:14px}
.creds code{font-family:var(--body);font-weight:700;font-size:1.05rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--coffee);color:var(--cream);padding:12px 22px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(41,28,14,.3);max-width:calc(100% - 32px);text-align:center}
.preview img{border-radius:14px;display:block;margin:10px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="root"></div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" data-action="close" aria-label="Закрыть">×</button>
    <div id="modal-body"></div>
  </div>

function ctaBand(title='Начнём с пробного занятия'){return `<section class="section alt"><div class="wrap"><div class="cta-band"><h2>${esc(title)}</h2><button class="btn" data-action="book">Записаться на пробное занятие</button></div></div></section>`}
function pageHead(title,sub){return `<div class="page-head"><div class="wrap"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div></div>`}
function renderSite(page){
  const c=S.content;
  document.title=(page?(PAGES[page]||LEGAL[page])+' — ':'')+c.name+', '+c.subject.toLowerCase();
  const nav=Object.entries(PAGES).filter(([k])=>k).map(([k,t])=>`<a href="#/${k}" ${page===k?'aria-current="page"':''}>${t}</a>`).join('');
  const body=LEGAL[page]?legalPage(page):{'':homePage,prices:pricesPage,bank:bankPage,results:resultsPage,about:aboutPage,faq:faqPage,rules:rulesPage}[page]();
  return `
  <header class="top"><div class="wrap">
    <a class="logo" href="#/">${esc(c.name)}</a>
    <button class="menu-btn" data-action="menu" aria-label="Меню" aria-expanded="false">☰</button>
    <nav class="nav" id="nav" aria-label="Разделы">${nav}</nav>
    ${STATIC?`<button class="btn small" data-action="book">Записаться</button>`:`<button class="btn small ghost" data-action="login">${session?'Личный кабинет':'Войти'}</button>`}
  </div></header>
  <main>${body}</main>
  <footer><div class="wrap"><span>${esc(c.name)}, ${esc(c.subject.toLowerCase())}</span><span style="white-space:pre-line">${esc(c.contacts.split('\n').join('   '))}</span>${STATIC?'':`<button data-action="login">${session?'Личный кабинет':'Вход для учеников'}</button>`}</div>
  <div class="wrap"><div class="legal" style="width:100%"><div>${operator()}</div><div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 20px"><a href="#/requisites">Реквизиты</a><a href="#/offer">Договор-оферта</a><a href="#/privacy">Политика обработки персональных данных</a><a href="#/consent">Согласие на обработку персональных данных</a></div></div></div></footer>`;
}
function homePage(){

  const secs=(c.bankSections||[]).length;
  const firstLine=String(c.about||'').split(/[.!?]/)[0];
  const nRev=S.reviews.length;
  const hub=[
    ['prices','Стоимость и акции',minPrice?`<span class="hub-big">от ${minPrice.toLocaleString('ru-RU')} ₽</span>за урок${(c.promos||[]).length?', и действует акция «'+esc(c.promos[0][0])+'»':''}`:'Цены на занятия'],
    ['about','Обо мне',esc(firstLine)],
    ['results','Результаты и отзывы',nRev?`${nRev} ${plural(nRev,'отзыв','отзыва','отзывов')} учеников`:'Скоро появятся'],
    ['bank','Банк заданий',secs?`${secs} ${plural(secs,'раздел','раздела','разделов')} для тренировки`:'Скоро'],
    ['faq','Частые вопросы','Что нужно для занятий, как проходит пробное и как оплачивать'],
    ['rules','Правила сотрудничества','Оплата, перенос и отмена занятий']
  ];
  return `
  <section class="hero"><div class="wrap">
    <div>
      <p class="muted" style="margin-bottom:14px">${esc(c.name)}, ${esc(c.subject.toLowerCase())}</p>
      <h1>${esc(c.tagline)}</h1>
      <p class="lead">${esc(c.lead)}</p>
      ${(c.info||[]).length?`<ul class="hero-info">${c.info.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
      <div class="actions">
        <button class="btn" data-action="book">Записаться на пробное занятие</button>
        <button class="btn ghost" data-action="scroll-how">Как проходят занятия</button>
      </div>
    </div>
    <figure class="portrait"><img src="${photo()}" alt="${esc(c.name)}">
      <figcaption class="tagcard"><strong>${esc(c.name)}</strong><span>${esc(c.photoCaption??'Преподаю математику третий год')}</span></figcaption></figure>
  </div></section>

  <section class="section alt" id="how"><div class="wrap">
    <h2>Как проходят занятия</h2>
    <p class="sub">От первой встречи до проверенной домашки — всё в одном месте.</p>
    <ol class="steps">${(c.steps||[]).map(s=>`<li><h3>${esc(s[0])}</h3><p>${esc(s[1]||'')}</p></li>`).join('')}</ol>
  </div></section>

  ${S.reviews.some(r=>r.text)?`<section class="section"><div class="wrap">
    <h2>Отзывы</h2><p class="sub">Ученики и родители о занятиях.</p>
    <div class="home-reviews">${S.reviews.filter(r=>r.text).slice(0,2).map(r=>reviewCard(r,false)).join('')}</div>
    <p style="margin-top:24px"><a class="btn ghost" href="#/results">Все отзывы (${S.reviews.length})</a></p>
  </div></section>`:''}

  <section class="section ${S.reviews.some(r=>r.text)?'alt':''}"><div class="wrap">
    <h2 style="margin-bottom:28px">Подробнее</h2>
    <div class="hub">${hub.map(h=>`<a href="#/${h[0]}"><h3>${h[1]}</h3><div class="hub-note">${h[2]}</div></a>`).join('')}</div>
  </div></section>
  ${S.reviews.some(r=>r.text)?`<section class="section"><div class="wrap"><div class="cta-band"><h2>Начнём с пробного занятия</h2><button class="btn" data-action="book">Записаться на пробное занятие</button></div></div></section>`:ctaBand()}`;
}
function plural(n,a,b,c){const m=n%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>1&&d<5)return b;return c}
function pricesPage(){
  const c=S.content;
  return pageHead('Стоимость','Оплата за занятие или пакетом. Перенести урок можно бесплатно, если предупредить за сутки.')+
  `<div class="page-body"><div class="wrap"><div class="price-list">${(c.prices||[]).map(p=>`<div class="price-row"><h3>${esc(p[0])}</h3><div class="p">${esc(p[1]||'')}</div>${p[2]?`<p>${esc(p[2])}</p>`:''}</div>`).join('')}</div>
  ${(c.promos||[]).length?`<div class="promos-block"><h2>Акции</h2><div class="promos">${c.promos.map(p=>`<div class="promo"><strong>${esc(p[0])}</strong><span>${esc(p[1]||'')}</span></div>`).join('')}</div></div>`:''}
  <p style="margin-top:36px" class="muted">Условия оплаты, переноса и отмены — в <a href="#/rules">правилах сотрудничества</a>. Оплачивая занятия, вы принимаете условия <a href="#/offer">договора-оферты</a>.</p></div></div>`+ctaBand();
}
function faqPage(){
  const c=S.content;

  `<div class="page-body"><div class="wrap"><div class="faq">${(c.faq||[]).map((q,i)=>`<details ${i===0?'open':''}><summary>${esc(q[0])}</summary><p>${esc(q[1]||'')}</p></details>`).join('')}</div>
  <div class="contact-box" style="margin-top:40px;max-width:760px"><h3>Остались вопросы?</h3><p>${esc(c.contacts)}</p></div></div></div>`+ctaBand();
}

  const c=S.content;
  return pageHead('Правила сотрудничества','Чтобы занятия шли по плану и никому не было неловко.')+

}
function bankPage(){
  return pageHead('Банк заданий',STATIC?'Задачи для самостоятельной тренировки по разделам.':'Задачи для самостоятельной тренировки по разделам. Полный банк с ответами открыт ученикам в личном кабинете.')+
  `<div class="page-body"><div class="wrap">${sectionsView(S.tasks.filter(t=>t.public),false)}
  ${STATIC?'':`<p style="margin-top:32px"><button class="btn ghost" data-action="login">${session?'Открыть личный кабинет':'Войти в личный кабинет'}</button></p>`}</div></div>`;
}
function reviewCard(r,admin){
  if(!r.text) return `<figure class="review"><button data-action="review-open" data-id="${r.id}" aria-label="Открыть отзыв${r.name?' — '+esc(r.name):''}"><img src="${imgSrc(r.img)}" alt="Отзыв${r.name?' — '+esc(r.name):''}" loading="lazy"></button>${r.name||admin?`<figcaption>${esc(r.name||'')}${admin?`<br><button class="btn small danger" style="padding-left:0" data-action="del-review" data-id="${r.id}">Удалить</button>`:''}</figcaption>`:''}</figure>`;
  return `<figure class="review txt"><div class="stars" aria-label="5 из 5">★★★★★</div><blockquote>${esc(r.text)}</blockquote>
    <figcaption style="padding:0"><div class="who"><strong>${esc(r.name||'')}</strong><span>${esc(r.date||'')}</span></div>
    ${r.img?`<button class="orig" data-action="review-open" data-id="${r.id}">Оригинал отзыва</button>`:''}
    ${admin?`<div><button class="btn small danger" style="padding-left:0;margin-top:8px" data-action="del-review" data-id="${r.id}">Удалить</button></div>`:''}</figcaption></figure>`;
}
function resultsPage(){
  const c=S.content;
  const res=(c.results||[]).length?`<div class="results">${c.results.map(r=>`<div class="result"><div class="r">${esc(r[1]||'')}</div><div class="n">${esc(r[0])}</div>${r[2]?`<p>${esc(r[2])}</p>`:''}</div>`).join('')}</div>`:'';
  const rev=S.reviews.length?`<div class="reviews">${S.reviews.map(r=>reviewCard(r,false)).join('')}</div>`:'<p class="empty">Скоро здесь появятся отзывы учеников.</p>';
  return pageHead('Результаты и отзывы','Что говорят ученики и родители.')+
  `<div class="page-body"><div class="wrap">${res}${res?'<h2 class="reviews-title" style="font-size:2rem;margin:56px 0 22px">Отзывы</h2>':''}${rev}</div></div>`+ctaBand('Хотите такой же результат?');
}
function aboutPage(){
  const c=S.content;
  return pageHead('Обо мне','')+
  `<div class="page-body"><div class="wrap"><div class="about">
    <div class="text">${paras(c.about)}</div>
    <div><div class="about-photo"><img src="${photo()}" alt="${esc(c.name)}"></div>
    <div class="contact-box"><h3>Связаться со мной</h3><p>${esc(c.contacts)}</p></div></div>
  </div></div></div>`+ctaBand();
}
function sectionsView(tasks,full){
  const secs=S.content.bankSections||[];
  const extra=[...new Set(tasks.map(t=>t.topic))].filter(t=>!secs.includes(t));
  const all=[...secs,...extra];
  if(!all.length) return '<p class="empty">Разделы скоро появятся.</p>';
  const withTasks=all.filter(sec=>tasks.some(t=>t.topic===sec));
  const empty=all.filter(sec=>!withTasks.includes(sec));
  return withTasks.map(sec=>`<h3 style="font-size:1.35rem;margin:28px 0 14px">${esc(sec)}</h3><div class="tasks">${tasks.filter(t=>t.topic===sec).map(taskCard).join('')}</div>`).join('')
    +(empty.length?`<div class="bank-secs" style="margin-top:${withTasks.length?'32px':'0'}">${empty.map(sec=>`<div class="bank-sec"><h3>${esc(sec)}</h3><p>Задания скоро появятся</p></div>`).join('')}</div>`:'');
}
function taskCard(t){
  return `<article class="task"><span class="tag">${esc(t.topic)}</span><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p>${t.answer?`<details><summary>Показать ответ</summary><div>${esc(t.answer)}</div></details>`:''}</article>`;
}

/* ---------- modal ---------- */
let lastFocus=null;
function openModal(html){lastFocus=document.activeElement;$('#modal-body').innerHTML=html;$('#modal').hidden=false;setTimeout(()=>($('#modal-body').querySelector('input,button,select,textarea')||$('#modal .x')).focus(),30)}
function closeModal(){$('#modal').hidden=true;$('#modal-body').innerHTML='';lastFocus?.focus?.()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

    const tel=phone.replace(/\D/g,'').replace(/^8/,'7');

      </div>
      <p class="muted" style="font-size:.85rem;margin-top:18px">Если пишете на почту, укажите имя ученика, класс и удобное время.</p>`);

function renderBooking(open){
  let html;
  if(booking.done){
    const d=booking.done;
    html=`<h3>Вы записаны</h3><p>Пробное занятие: <strong>${esc(fmtDate(d.date,{weekday:'long',day:'numeric',month:'long'}))}, ${esc(d.time)}</strong>.</p><p class="muted">Я свяжусь с вами (${esc(d.contact)}), чтобы подтвердить время и прислать ссылку на урок.</p><button class="btn" data-action="close">Готово</button>`;
  }else{
    const free=freeSlots();
    const dates=[...new Set(free.map(s=>s.date))];
    if(!dates.length){
      html=`<h3>Запись на пробное занятие</h3><p>Свободных окон сейчас нет. Напишите мне — подберём время:</p><p style="white-space:pre-line">${esc(S.content.contacts)}</p>`;
    }else{
      if(!booking.date||!dates.includes(booking.date)) booking.date=dates[0];
      const times=free.filter(s=>s.date===booking.date);
      const sel=S.slots.find(s=>s.id===booking.slotId);
      html=`<h3>Запись на пробное занятие</h3><p class="muted">Первое занятие бесплатное, 30 минут онлайн. Выберите удобный день и время.</p>
        <div class="label-s">День</div>
        <div class="chips">${dates.map(d=>`<button class="chip ${d===booking.date?'on':''}" data-action="pick-date" data-date="${d}">${esc(fmtDate(d))}</button>`).join('')}</div>
        <div class="label-s">Время</div>
        <div class="chip-grid">${times.map(s=>`<button class="chip ${s.id===booking.slotId?'on':''}" data-action="pick-slot" data-id="${s.id}">${esc(s.time)}</button>`).join('')}</div>
        ${sel?`<form data-form="booking" style="margin-top:22px">
          <div class="field"><label for="b-name">Имя ученика</label><input id="b-name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="b-contact">Телефон или Telegram для связи</label><input id="b-contact" name="contact" required></div>
          <div class="field"><label for="b-note">Класс и цель занятий</label><input id="b-note" name="note" placeholder="Например: 9 класс, подготовка к ОГЭ"></div>
          ${consentBox()}
          <button class="btn" type="submit">Записаться на ${esc(fmtDate(sel.date,{day:'numeric',month:'long'}))}, ${esc(sel.time)}</button>
        </form>`:''}`;
    }
  }
  if(open) openModal(html); else $('#modal-body').innerHTML=html;
}

function renderStudent(){
  const st=S.students.find(s=>s.id===session.id);
  if(!st){session=null;setSession(null);return renderSite('')}
  const hw=S.homework.filter(h=>h.studentId===st.id);
  const todo=hw.filter(h=>h.status==='assigned').length;
  const tabs=[['schedule','Расписание'],['homework','Домашнее задание',todo],['progress','Прогресс'],['payments','Оплата'],['bank','Банк заданий']];
  let body='';
  if(stuTab==='schedule'){
    const ls=S.lessons.filter(l=>l.studentId===st.id).sort(sortByWhen);
    const up=ls.filter(l=>isFuture(l.date,l.time)||when(l.date,l.time).getTime()+(l.duration||60)*60000>Date.now());
    const past=ls.filter(l=>!up.includes(l)).reverse();
    body=`<h2>Расписание</h2><p class="muted" style="margin-bottom:22px">Ближайшие занятия. Ссылка на урок появится здесь.</p>
    ${up.length?`<div class="list">${up.map(lessonItem).join('')}</div>`:'<p class="empty">Новых занятий пока нет — преподаватель добавит их в расписание.</p>'}
    ${past.length?`<details style="margin-top:28px"><summary style="cursor:pointer;font-weight:600">Прошедшие занятия (${past.length})</summary><div class="list" style="margin-top:14px">${past.map(l=>lessonItem(l,true)).join('')}</div></details>`:''}`;
  }else if(stuTab==='homework'){
    const order={assigned:0,submitted:1,checked:2};
    const list=[...hw].sort((a,b)=>order[a.status]-order[b.status]||(a.due||'').localeCompare(b.due||''));
    body=`<h2>Домашнее задание</h2><p class="muted" style="margin-bottom:22px">Прикрепите фото или файл с решением и отправьте на проверку. До 2 МБ на файл.</p>
    ${list.length?`<div class="list">${list.map(studentHw).join('')}</div>`:'<p class="empty">Заданий пока нет.</p>'}`;
  }else if(stuTab==='payments'){
    body=`<h2>Оплата</h2><p class="muted" style="margin-bottom:24px">${st.payType==='package'?'Сколько занятий осталось по абонементу. После каждого урока преподаватель списывает одно занятие.':'Оплата после каждого занятия. Здесь видно, какие занятия уже оплачены.'}</p>${studentPayView(st)}`;
  }else if(stuTab==='progress'){
    body=`<h2>Задания ЕГЭ</h2><p class="muted" style="margin-bottom:22px">Какие задания мы уже разобрали на занятиях. Отмечает преподаватель.</p>
    ${progressView(st.id,false)}
    <h2 style="margin-top:52px">Пробники по месяцам</h2><p class="muted" style="margin-bottom:22px">Результаты пробных экзаменов в тестовых баллах.</p>
    ${mocksView(st.id,false)}`;
  }else{
    body=`<h2>Банк заданий</h2><p class="muted" style="margin-bottom:22px">Задачи для самостоятельной тренировки с ответами.</p>${bankView()}`;
  }
  return `<header class="app-head"><div class="wrap">
    <div class="who"><small>Личный кабинет</small><strong>${esc(st.name)}</strong></div>
    <button class="btn small ghost" data-action="to-site">На сайт</button>
    <button class="btn small ghost" data-action="logout">Выйти</button>
  </div></header>
  <main class="wrap panel">
    <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${stuTab===t[0]?'on':''}" role="tab" aria-selected="${stuTab===t[0]}" data-action="stu-tab" data-tab="${t[0]}">${t[1]}${t[2]?`<span class="count">${t[2]}</span>`:''}</button>`).join('')}</div>
    ${body}
  </main>`;
}
function lessonItem(l,past){
  const link=l.link&&/^https?:\/\//.test(l.link)?`<a class="btn small" href="${esc(l.link)}" target="_blank" rel="noopener">Открыть урок</a>`:'';
  return `<div class="item lesson" ${past?'style="opacity:.7"':''}>
    <div class="when">${esc(l.time)}<small>${esc(fmtDate(l.date))}</small></div>
    <div><h4>${esc(l.topic||'Занятие')}</h4><div class="meta">${l.duration||60} минут</div></div>
    <div>${past?'':link}</div></div>`;
}
function statusBadge(h){
  if(h.status==='checked') return `<span class="badge ok">Проверено</span>`;
  if(h.status==='submitted') return `<span class="badge sub">На проверке</span>`;
  if(h.due&&isoDay(0)>h.due) return `<span class="badge late">Срок прошёл</span>`;
  return `<span class="badge">Нужно сделать</span>`;
}
function studentHw(h){

    <div class="item-top"><h4>${esc(h.title)}</h4>${statusBadge(h)}</div>
    ${h.due?`<div class="meta">Сдать до ${esc(fmtDate(h.due,{day:'numeric',month:'long'}))}</div>`:''}
    ${h.desc?`<p class="desc">${esc(h.desc)}</p>`:''}

    ${h.review?`<div class="sub-block"><strong>Комментарий преподавателя${h.review.grade?` — ${esc(h.review.grade)}`:''}</strong>${h.review.comment?`<p class="desc">${esc(h.review.comment)}</p>`:''}</div>`:''}
    ${h.status!=='checked'?`<form class="sub-block" data-form="submit-hw" data-id="${h.id}">
      <div class="field"><label for="f-${h.id}">${sub?'Отправить заново':'Прикрепить решение'}</label><input id="f-${h.id}" type="file" name="files" multiple accept="image/*,.pdf,.doc,.docx,.txt"></div>
      <div class="field"><label for="c-${h.id}">Комментарий (необязательно)</label><textarea id="c-${h.id}" name="comment" style="min-height:60px" placeholder="Например: не получилась задача 7"></textarea></div>
      <button class="btn small" type="submit">Отправить на проверку</button></form>`:''}

function bankList(list){
  if(!bankTopic&&!bankQuery) return sectionsView(S.tasks,true);
  return list.length?`<div class="tasks">${list.map(taskCard).join('')}</div>`:'<p class="empty">Задач по этому запросу нет.</p>';

function bankView(){
  const topics=[...new Set([...(S.content.bankSections||[]),...S.tasks.map(t=>t.topic)])];
  const q=bankQuery.toLowerCase();
  const list=S.tasks.filter(t=>(!bankTopic||t.topic===bankTopic)&&(!q||(t.title+' '+t.text).toLowerCase().includes(q)));

    <input type="search" data-input="bank-q" placeholder="Поиск по задачам" value="${esc(bankQuery)}" aria-label="Поиск">
  </div>
  <div id="bank-list">${bankList(list)}</div>`;
}

/* ---------- payments ---------- */
function rub(n){return (+n||0).toLocaleString('ru-RU')+' ₽'}
function lessonWord(n){return plural(Math.abs(n),'занятие','занятия','занятий')}
const PAYTYPE={package:'Абонемент',single:'Оплата после урока'};
function stu(id){return S.students.find(x=>x.id===id)}
function pkgsOf(sid){return S.packages.filter(k=>k.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0))}
function usedOf(pk){return S.charges.filter(c=>c.packageId===pk.id).length}
function activePkg(sid){return pkgsOf(sid).find(k=>usedOf(k)<k.total)||null}
function chargesOf(sid){return S.charges.filter(c=>c.studentId===sid).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))||(b.created||0)-(a.created||0))}
function unpaidOf(sid){return S.charges.filter(c=>c.studentId===sid&&c.kind==='single'&&!c.paid)}
function payStatus(st){
  if(st.payType==='package'){
    const a=activePkg(st.id);
    if(a){const left=a.total-usedOf(a);return {text:`Осталось ${left} из ${a.total}`,cls:left<=1?'sub':'ok'}}
    return {text:pkgsOf(st.id).length?'Абонемент закончился':'Абонемента нет',cls:'late'};
  }
  const un=unpaidOf(st.id);
  return un.length?{text:`Не оплачено: ${un.length} ${lessonWord(un.length)}`,cls:'late',sum:un.reduce((a,c)=>a+(+c.price||0),0)}:{text:'Всё оплачено',cls:'ok'};
}
function unrecorded(sid){
  const done=new Set(S.charges.map(c=>c.lessonId).filter(Boolean));
  const from=isoDay(-30);
  return S.lessons.filter(l=>l.studentId===sid&&!isFuture(l.date,l.time)&&l.date>=from&&!done.has(l.id)).sort(sortByWhen).reverse().slice(0,10);
}

function shortRub(n){return n>=1000?(Math.round(n/100)/10).toLocaleString('ru-RU')+'к':String(n)}
function incomeChart(months){
  const W=640,H=250,L=44,R=12,T=26,B=34,pw=W-L-R,ph=H-T-B;
  const max=Math.max(...months.map(m=>m.sum),1);
  const step=[1000,2000,5000,10000,20000,50000,100000].find(s=>max/s<=5)||Math.ceil(max/5/100000)*100000;
  const top=Math.ceil(max/step)*step;
  const y=v=>T+(1-v/top)*ph,bw=pw/months.length;
  const grid=[];for(let v=0;v<=top;v+=step)grid.push(`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${shortRub(v)}</text>`);
  const cur=monthKey(0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Доход по месяцам">${grid.join('')}
    ${months.map((m,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=ph*(m.sum/top);return `<rect class="bar ${m.key===cur?'cur':''}" x="${x}" y="${y(m.sum)}" width="${w}" height="${Math.max(h,0)}" rx="5"/>${m.sum?`<text class="val" x="${x+w/2}" y="${y(m.sum)-7}" text-anchor="middle" style="font-size:11px">${shortRub(m.sum)}</text>`:''}<text class="ax" x="${x+w/2}" y="${H-12}" text-anchor="middle" style="font-size:11px">${esc(fmtMonth(m.key,true))}</text>`}).join('')}
  </svg>`;
}

/* ---------- progress ---------- */
const PROG_LABEL=['Не разобрано','Разобрано частично','Полностью разобрано'];
function egeCount(){return Math.max(1,Math.min(40,+S.content.egeCount||20))}
function getProg(id){const a=S.progress[id]||[];return Array.from({length:egeCount()},(_,i)=>a[i]||0)}
function fmtMonth(m,short){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1,1);
  return short?d.toLocaleDateString('ru-RU',{month:'short'}).replace('.',''):d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(/\s?г\.?$/,'')}
function progressView(sid,editable){
  const p=getProg(sid),n=p.length,c=[0,1,2].map(k=>p.filter(x=>x===k).length);
  const pct=k=>(c[k]/n*100).toFixed(2)+'%';
  const tile=(st,i)=>editable
    ?`<button class="ege s${st}" data-action="cycle-task" data-sid="${sid}" data-n="${i}" aria-label="Задание ${i+1}: ${PROG_LABEL[st]}" title="${PROG_LABEL[st]}. Нажмите, чтобы изменить">${i+1}</button>`
    :`<div class="ege s${st}" role="img" aria-label="Задание ${i+1}: ${PROG_LABEL[st]}" title="${PROG_LABEL[st]}">${i+1}</div>`;
  return `<div class="prog-head"><div class="big">${c[2]}<small> из ${n} разобрано полностью</small></div><div class="muted">Частично: ${c[1]}. Не разобрано: ${c[0]}.</div></div>
  <div class="prog-bar" aria-hidden="true"><i class="b2" style="width:${pct(2)}"></i><i class="b1" style="width:${pct(1)}"></i></div>
  <div class="ege-grid">${p.map(tile).join('')}</div>
  <div class="legend">${PROG_LABEL.map((l,k)=>`<span><i class="ege s${k}"></i>${l}</span>`).join('')}</div>`;
}
function mocksOf(sid){return S.mocks.filter(m=>m.studentId===sid).sort((a,b)=>a.month.localeCompare(b.month))}
function mockChart(list){
  if(!list.length) return '';
  const W=640,H=250,L=34,R=18,T=26,B=34,pw=W-L-R,ph=H-T-B;
  const x=i=>L+(list.length===1?pw/2:i*pw/(list.length-1)),y=v=>T+(1-Math.max(0,Math.min(100,v))/100)*ph;
  const pts=list.map((m,i)=>[x(i),y(m.score)]);
  const years=new Set(list.map(m=>m.month.slice(0,4))).size>1;
  const grid=[0,25,50,75,100].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=list.length>1?`<polygon class="area" points="${pts[0][0]},${y(0)} ${line} ${pts.at(-1)[0]},${y(0)}"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Баллы за пробники по месяцам">${grid}${area}
    ${list.length>1?`<polyline class="ln" points="${line}"/>`:''}
    ${pts.map((p,i)=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="5"/><text class="val" x="${p[0]}" y="${p[1]-12}" text-anchor="middle">${list[i].score}</text><text class="ax" x="${p[0]}" y="${H-10}" text-anchor="middle">${esc(fmtMonth(list[i].month,true))}${years?' '+list[i].month.slice(2,4):''}</text>`).join('')}
  </svg>`;
}
function mocksView(sid,editable){
  const list=mocksOf(sid);
  if(!list.length) return `<p class="empty">${editable?'Добавьте первый результат пробника.':'Результатов пробников пока нет — они появятся после первого пробного экзамена.'}</p>`;
  const best=Math.max(...list.map(m=>m.score));
  return `<div class="box" style="padding:18px 16px 8px;margin-bottom:16px">${mockChart(list)}</div>

    <h3>Реквизиты для документов</h3>
    ${lg().inn?'':'<div class="warn-box">Укажите ИНН — по закону он должен быть на сайте. Реквизиты подставятся в подвал, договор-оферту, политику и согласие.</div>'}
    <div class="field"><label for="lg-f">ФИО полностью</label><input id="lg-f" name="fio" value="${esc(lg().fio)}" required placeholder="Фамилия Имя Отчество"></div>
    <div class="row"><div class="field"><label for="lg-s">Статус</label><select id="lg-s" name="status"><option value="npd" ${lg().status!=='ip'?'selected':''}>Самозанятый</option><option value="ip" ${lg().status==='ip'?'selected':''}>ИП</option></select></div>
    <div class="field"><label for="lg-i">ИНН</label><input id="lg-i" name="inn" value="${esc(lg().inn)}" inputmode="numeric" pattern="\\d{12}" title="12 цифр"></div></div>
    <div class="row"><div class="field"><label for="lg-o">ОГРНИП (только для ИП)</label><input id="lg-o" name="ogrnip" value="${esc(lg().ogrnip)}" inputmode="numeric"></div>
    <div class="field"><label for="lg-e">Почта для запросов по данным</label><input id="lg-e" name="email" type="email" value="${esc(lg().email)}" required></div></div>
    <button class="btn" type="submit">Сохранить реквизиты</button>
  </form>
  <form data-form="admin-cred" class="box" style="max-width:760px;margin-top:24px">
    <h3>Ваш вход в панель</h3>
    <div class="row"><div class="field"><label for="a-l">Логин</label><input id="a-l" name="login" value="${esc(S.admin.login)}" required autocapitalize="off"></div>
    <div class="field"><label for="a-p">Новый пароль</label><input id="a-p" name="password" type="password" minlength="6" required autocomplete="new-password"></div></div>
    <button class="btn" type="submit">Сменить пароль</button>
  </form>
  <div class="box" style="max-width:760px;margin-top:24px"><h3>Сбросить данные</h3><p class="muted">Удалит учеников, задания и тексты и вернёт демо-данные.</p><button class="btn small danger" data-action="reset-all">Сбросить всё</button></div>`;
}

/* ---------- render ---------- */
function render(){
  const root=$('#root');const r=route();
  if(r==='cabinet'&&STATIC){history.replaceState(null,'','#/');return render()}
  if(r==='cabinet'){
    if(session){document.title=session.role==='admin'?'Панель преподавателя':'Личный кабинет';root.innerHTML=session.role==='admin'?renderAdmin():renderStudent();return}
    history.replaceState(null,'','#/');
  }
  if(r==='promos'){history.replaceState(null,'','#/prices');return render()}
  root.innerHTML=renderSite(PAGES[r]!==undefined||LEGAL[r]?r:'');
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- events ---------- */
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Скопировано')}
  catch(e){openModal(`<h3>Данные для входа</h3><p class="muted">Выделите и скопируйте:</p><div class="field"><textarea readonly style="min-height:110px">${esc(t)}</textarea></div>`)}
}
function credsText(s){return `Доступ в личный кабинет\nЛогин: ${s.login}\nПароль: ${s.password}`}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'book':openBooking();break;
    case 'login':if(session)go('cabinet');else openLogin();break;
    case 'menu':{const n=$('#nav');const o=n.classList.toggle('open');el.setAttribute('aria-expanded',o);break}
    case 'scroll-how':document.getElementById('how')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break;
    case 'close':closeModal();break;
    case 'pick-date':booking.date=el.dataset.date;booking.slotId=null;renderBooking();break;
    case 'pick-slot':booking.slotId=id;renderBooking();setTimeout(()=>$('#b-name')?.focus(),20);break;
    case 'to-site':go('');break;
    case 'logout':session=null;setSession(null);lastCreds=null;go('');break;
    case 'stu-tab':stuTab=el.dataset.tab;render();break;
    case 'adm-tab':admTab=el.dataset.tab;lastCreds=null;render();break;
    case 'file':{const f=findFile(el.dataset.ref,+el.dataset.i);currentRef={ref:el.dataset.ref,i:+el.dataset.i};if(f)openFile(f);break}
    case 'save-file':{const f=findFile(el.dataset.ref,+el.dataset.i);if(f)saveFile(f);break}
    case 'regen-pass':$('#st-pass').value=genPassword();break;
    case 'copy-creds':if(lastCreds)copyText(credsText(lastCreds));break;
    case 'copy-student':{const s=S.students.find(x=>x.id===id);if(s)copyText(credsText(s));break}
    case 'reset-pass':{const s=S.students.find(x=>x.id===id);if(!s)break;if(!confirm(`Выдать новый пароль ученику ${s.name}? Старый перестанет работать.`))break;s.password=genPassword();if(commit()){render();toast(`Новый пароль: ${s.password}`)}break}
    case 'del-student':{const s=S.students.find(x=>x.id===id);if(!s||!confirm(`Удалить ученика ${s.name} вместе с его расписанием и заданиями?`))break;
      S.students=S.students.filter(x=>x.id!==id);S.lessons=S.lessons.filter(l=>l.studentId!==id);S.homework=S.homework.filter(h=>h.studentId!==id);delete S.progress[id];S.mocks=S.mocks.filter(m=>m.studentId!==id);S.packages=S.packages.filter(k=>k.studentId!==id);S.charges=S.charges.filter(c=>c.studentId!==id);commit();render();break}
    case 'cycle-task':{const sid=el.dataset.sid,n=+el.dataset.n;const p=getProg(sid);p[n]=(p[n]+1)%3;S.progress[sid]=p;if(commit()){render();document.querySelector(`[data-action=cycle-task][data-n="${n}"]`)?.focus()}break}
    case 'pay-select':payStudent=id;render();break;
    case 'charge-lesson':{
      const l=S.lessons.find(x=>x.id===el.dataset.lid);const st=l&&stu(l.studentId);if(!st)break;
      if(st.payType==='package'){const a=activePkg(st.id);if(!a){toast('Абонемент закончился — сначала оформите новый');break}
        S.charges.push({id:uid('ch'),studentId:st.id,kind:'package',packageId:a.id,lessonId:l.id,date:l.date,time:l.time,topic:l.topic,created:Date.now()});
        if(commit()){render();toast(`Списано. Осталось ${a.total-usedOf(a)} из ${a.total}`)}}
      else{const paid=el.dataset.paid==='1';S.charges.push({id:uid('ch'),studentId:st.id,kind:'single',lessonId:l.id,date:l.date,time:l.time,topic:l.topic,price:+st.price||0,paid,paidDate:paid?l.date:null,created:Date.now()});
        if(commit()){render();toast(paid?'Занятие отмечено оплаченным':'Занятие добавлено как неоплаченное')}}
      break}
    case 'undo-charge':{const c=S.charges.find(x=>x.id===id);if(!c)break;if(!confirm(c.kind==='package'?'Вернуть занятие на абонемент?':'Удалить это занятие из учёта?'))break;S.charges=S.charges.filter(x=>x.id!==id);commit();render();break}
    case 'toggle-paid':{const c=S.charges.find(x=>x.id===id);if(!c)break;c.paid=!c.paid;c.paidDate=c.paid?isoDay(0):null;if(commit())render();break}
    case 'del-package':{const k=S.packages.find(x=>x.id===id);if(!k)break;const n=usedOf(k);if(!confirm(n?`Удалить абонемент вместе с ${n} списанными занятиями?`:'Удалить абонемент?'))break;
      S.packages=S.packages.filter(x=>x.id!==id);S.charges=S.charges.filter(c=>c.packageId!==id);commit();render();break}
    case 'del-review':if(!confirm('Убрать отзыв с сайта?'))break;S.reviews=S.reviews.filter(r=>r.id!==id);commit();render();break;
    case 'review-open':{const r=S.reviews.find(x=>x.id===id);if(r)openModal(`<h3>${esc(r.name||'Отзыв')}</h3><div class="preview"><img src="${imgSrc(r.img)}" alt="Отзыв"></div>`);break}
    case 'del-mock':S.mocks=S.mocks.filter(m=>m.id!==id);commit();render();break;
    case 'del-lesson':S.lessons=S.lessons.filter(l=>l.id!==id);commit();render();break;
    case 'del-hw':if(!confirm('Удалить задание вместе с решением ученика?'))break;S.homework=S.homework.filter(h=>h.id!==id);commit();render();break;
    case 'del-slot':S.slots=S.slots.filter(s=>s.id!==id||s.booked);commit();render();break;
    case 'trial-done':{const t=S.trials.find(x=>x.id===id);if(t){t.done=true;commit();render()}break}
    case 'del-trial':{const t=S.trials.find(x=>x.id===id);if(!t||!confirm('Удалить заявку? Окно снова станет свободным.'))break;
      const sl=S.slots.find(s=>s.id===t.slotId);if(sl)sl.booked=false;S.trials=S.trials.filter(x=>x.id!==id);commit();render();break}
    case 'toggle-public':{const t=S.tasks.find(x=>x.id===id);if(t){t.public=!t.public;commit();render()}break}
    case 'del-task':if(!confirm('Удалить задачу?'))break;S.tasks=S.tasks.filter(t=>t.id!==id);commit();render();break;
    case 'reset-all':if(!confirm('Точно удалить все данные и вернуть демо-версию?'))break;S=seed();migrate();commit();session=null;setSession(null);go('');toast('Данные сброшены. Вход: admin / admin');break;
  }
});

document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;
  if(k==='bank-topic'){bankTopic=e.target.value;render()}
  if(k==='hw-filter'){hwStudentFilter=e.target.value;render()}
  if(k==='prog-student'){progStudent=e.target.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.input==='bank-q'){bankQuery=e.target.value;const q=bankQuery.toLowerCase();
    const list=S.tasks.filter(t=>(!bankTopic||t.topic===bankTopic)&&(!q||(t.title+' '+t.text).toLowerCase().includes(q)));
    $('#bank-list').innerHTML=bankList(list)}
});

document.addEventListener('submit',async e=>{
  const f=e.target,kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const fd=new FormData(f);const v=k=>String(fd.get(k)??'').trim();
  const btn=f.querySelector('[type=submit]');
  switch(kind){
    case 'booking':{
      const sl=S.slots.find(s=>s.id===booking.slotId);
      if(!sl||sl.booked){toast('Это время уже заняли — выберите другое');booking.slotId=null;renderBooking();break}
      sl.booked=true;
      const t={id:uid('tr'),slotId:sl.id,date:sl.date,time:sl.time,name:v('name'),contact:v('contact'),note:v('note'),consentAt:Date.now(),consentEd:lg().edition,created:Date.now(),done:false};
      S.trials.push(t);if(commit()){booking.done=t;renderBooking()}
      break}
    case 'login':{
      const l=v('login').toLowerCase(),p=String(fd.get('password')||'');
      if(l===S.admin.login.toLowerCase()&&p===S.admin.password){session={role:'admin'}}
      else{const s=S.students.find(x=>x.login.toLowerCase()===l&&x.password===p);if(s)session={role:'student',id:s.id}}
      if(!session){openLogin('Неверный логин или пароль. Проверьте раскладку и регистр.');$('#l-login').value=v('login');break}
      setSession(session);closeModal();stuTab='schedule';admTab='students';go('cabinet');
      break}
    case 'add-student':{
      let login=v('login').toLowerCase().replace(/[^a-z0-9._-]/g,'');
      if(!login)login=makeLogin(v('name'));
      if(S.students.some(s=>s.login===login)||login===S.admin.login){toast(`Логин «${login}» уже занят — придумайте другой`);break}
      const s={id:uid('st'),name:v('name'),info:v('info'),login,password:v('password'),payType:v('payType')==='package'?'package':'single',price:Math.max(0,+v('price')||0),consentAt:Date.now(),created:Date.now()};
      S.students.push(s);if(commit()){lastCreds=s;render()}
      break}
    case 'add-lesson':{
      const n=+v('repeat')||1;
      for(let i=0;i<n;i++){const d=new Date(v('date')+'T12:00');d.setDate(d.getDate()+7*i);
        S.lessons.push({id:uid('ls'),studentId:v('studentId'),date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,time:v('time'),duration:+v('duration')||60,topic:v('topic'),link:v('link')})}
      if(commit()){render();toast(n>1?`Добавлено занятий: ${n}`:'Занятие добавлено')}
      break}
    case 'add-hw':{
      btn.disabled=true;const files=await readFiles(f.querySelector('[name=files]'));btn.disabled=false;if(files===null)break;
      S.homework.push({id:uid('hw'),studentId:v('studentId'),title:v('title'),desc:v('desc'),due:v('due'),files,status:'assigned',submission:null,review:null,created:Date.now()});
      hwStudentFilter=v('studentId');
      if(commit()){render();toast('Задание выдано')}
      break}
    case 'review':{
      const h=S.homework.find(x=>x.id===f.dataset.id);if(!h)break;
      h.review={grade:v('grade'),comment:v('comment'),at:Date.now()};h.status='checked';
      if(commit()){render();toast('Задание проверено')}
      break}
    case 'submit-hw':{
      const h=S.homework.find(x=>x.id===f.dataset.id);if(!h)break;
      btn.disabled=true;const files=await readFiles(f.querySelector('[name=files]'));btn.disabled=false;if(files===null)break;
      if(!files.length&&!v('comment')){toast('Прикрепите файл с решением или напишите комментарий');break}
      h.submission={files,comment:v('comment'),at:Date.now()};h.status='submitted';
      if(commit()){render();toast('Решение отправлено на проверку')}
      break}
    case 'add-slots':{
      const times=v('times').split(/[,\s;]+/).map(t=>t.replace('.',':')).filter(t=>/^\d{1,2}:\d{2}$/.test(t)).map(t=>t.padStart(5,'0'));
      if(!times.length){toast('Укажите время в формате 16:00');break}
      let added=0;times.forEach(t=>{if(!S.slots.some(s=>s.date===v('date')&&s.time===t)){S.slots.push({id:uid('sl'),date:v('date'),time:t,booked:false});added++}});
      if(commit()){render();toast(`Добавлено окон: ${added}`)}
      break}
    case 'pay-settings':{
      const st=stu(payStudent);if(!st)break;
      st.payType=v('payType')==='package'?'package':'single';st.price=Math.max(0,+v('price')||0);
      if(commit()){render();toast('Сохранено')}
      break}
    case 'add-package':{
      const total=Math.max(1,Math.round(+v('total')||8));
      S.packages.push({id:uid('pk'),studentId:payStudent,date:v('date'),total,amount:Math.max(0,+v('amount')||0),created:Date.now()});
      if(commit()){render();toast('Абонемент оформлен')}
      break}
    case 'add-charge':{
      const st=stu(payStudent);if(!st)break;
      if(st.payType==='package'){const a=activePkg(st.id);if(!a){toast('Абонемент закончился — сначала оформите новый');break}
        S.charges.push({id:uid('ch'),studentId:st.id,kind:'package',packageId:a.id,lessonId:null,date:v('date'),time:'',topic:v('topic'),created:Date.now()});
        if(commit()){render();toast(`Списано. Осталось ${a.total-usedOf(a)} из ${a.total}`)}}
      else{const paid=fd.get('paid')==='on';S.charges.push({id:uid('ch'),studentId:st.id,kind:'single',lessonId:null,date:v('date'),time:'',topic:v('topic'),price:Math.max(0,+v('price')||0),paid,paidDate:paid?v('date'):null,created:Date.now()});
        if(commit()){render();toast('Занятие добавлено')}}
      break}
    case 'add-review-text':{
      const file=f.querySelector('[name=file]')?.files?.[0];let img='';
      if(file){btn.disabled=true;try{img=await shrinkImage(file,720,1600)}catch(err){toast('Не удалось прочитать скриншот')}btn.disabled=false}
      S.reviews.unshift({id:uid('rv'),name:v('name'),date:v('date'),text:String(fd.get('text')||'').trim(),img});
      if(commit()){render();toast('Отзыв добавлен')}
      break}
    case 'add-review':{
      const files=[...(f.querySelector('[name=files]').files||[])];if(!files.length)break;
      btn.disabled=true;let added=0;
      for(const file of files){try{S.reviews.push({id:uid('rv'),img:await shrinkImage(file,900,1600),name:v('name')});added++}catch(err){toast(`Не удалось прочитать «${file.name}»`)}}
      btn.disabled=false;
      if(commit()){render();toast(`Добавлено отзывов: ${added}`)}
      break}
    case 'add-mock':{
      const month=v('month'),score=Math.round(+v('score'));
      if(!/^\d{4}-\d{2}$/.test(month)||isNaN(score)||score<0||score>100){toast('Укажите месяц и баллы от 0 до 100');break}
      S.mocks=S.mocks.filter(m=>!(m.studentId===progStudent&&m.month===month));
      S.mocks.push({id:uid('mk'),studentId:progStudent,month,score,note:v('note')});
      if(commit()){render();toast('Результат добавлен')}
      break}
    case 'add-task':{
      S.tasks.unshift({id:uid('t'),topic:v('topic'),title:v('title'),text:String(fd.get('text')||'').trim(),answer:v('answer'),public:fd.get('public')==='on'});
      if(commit()){render();toast('Задача добавлена')}
      break}
    case 'content':{
      const c=S.content;
      const ph=f.querySelector('[name=photo]')?.files?.[0];
      if(ph){btn.disabled=true;try{c.photo=await shrinkImage(ph)}catch(err){toast('Не удалось прочитать фото')}btn.disabled=false}
      Object.assign(c,{photoCaption:v('photoCaption'),name:v('name'),subject:v('subject'),tagline:v('tagline'),lead:v('lead'),about:String(fd.get('about')||'').trim(),contacts:v('contacts'),
        info:v('info').split('\n').map(x=>x.trim()).filter(Boolean),
        egeCount:+v('egeCount')||20,
        bankSections:v('bankSections').split('\n').map(x=>x.trim()).filter(Boolean),
        steps:lines(fd.get('steps')),prices:lines(fd.get('prices')),promos:lines(fd.get('promos')),results:lines(fd.get('results')),faq:lines(fd.get('faq')),rules:lines(fd.get('rules'))});
      if(commit()){render();toast('Тексты сохранены')}
      break}
    case 'legal':{
      S.content.legal={fio:v('fio'),status:v('status')==='ip'?'ip':'npd',inn:v('inn').replace(/\D/g,''),ogrnip:v('ogrnip').replace(/\D/g,''),email:v('email'),edition:isoDay(0)};
      if(commit()){render();toast('Реквизиты сохранены')}
      break}
    case 'admin-cred':{
      const login=v('login').toLowerCase();
      if(S.students.some(s=>s.login===login)){toast('Этот логин занят учеником');break}
      S.admin={login,password:String(fd.get('password'))};if(commit()){render();toast('Данные для входа обновлены')}
      break}
  }
});

render();
</script>
</body>
</html>
